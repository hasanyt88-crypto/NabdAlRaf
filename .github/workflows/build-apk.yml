name: Build APK

on:
  push:
    branches: [ "main", "master", "Hasan" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: npm install

    - name: Add Android Platform
      run: npx cap add android

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Decode Keystore
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

    - name: Configure Gradle Signing
      run: |
        cd android/app
        sed -i 's/android {/android {\n    signingConfigs {\n        release {\n            storeFile file("release.keystore")\n            storePassword "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"\n            keyAlias "${{ secrets.ANDROID_KEY_ALIAS }}"\n            keyPassword "${{ secrets.ANDROID_KEY_PASSWORD }}"\n        }\n    }/g' build.gradle
        sed -i 's/buildTypes {/buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }/g' build.gradle

    - name: Build Release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NabdAlRaf-APK
        path: android/app/build/outputs/apk/release/app-release.apk
