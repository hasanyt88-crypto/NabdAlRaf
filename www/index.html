<script>
const T=new Date().toISOString().slice(0,10),ROLES=['مندوب تجزئة','مندوب جملة','مندوب سوبرات'],SROLES=['مشرف تجزئة','مشرف جملة','مشرف سوبرات','مدير منطقة','مدير قطاع','مدير قناة','مدير مبيعات'],DEPTS=['صناعة','متنوعة'],TEAMS=['صناعة','متنوعة','دمج'];
let S={items:[],reps:[],sups:[],areas:[],targets:[],daily:[],cfg:{url:'',key:''}},tab='d',per='m';
try{Object.assign(S,JSON.parse(localStorage.getItem('nabd')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('nabd',JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i),f0=n=>Math.round(n||0).toLocaleString('en'),pc=(a,b)=>b?Math.round(a/b*100):0;
const inP=(d,p)=>p=='d'?d==T:p=='m'?d.slice(0,7)==T.slice(0,7):d.slice(0,4)==T.slice(0,4);
const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const opt=(a,k='name')=>a.map(x=>`<option>${x[k]??x}</option>`).join('');
const rep=n=>S.reps.find(r=>r.name==n)||{},sup=n=>S.sups.find(s=>s.name==n)||{};
const bar=p=>`<div class="bar"><i style="width:${Math.min(p,100)}%"></i></div>`;
function tbl(h,rows){return `<div class="wrap"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||'<tr><td>لا بيانات</td></tr>'}</table></div>`}
function fm(id,title,fs){return `<div class="card"><h3>${title}</h3>${fs.map(([k,l,t,o])=>o?`<select id="${id}_${k}"><option value="">${l}</option>${o}</select>`:`<input id="${id}_${k}" type="${t||'text'}" placeholder="${l}">`).join('')}<button class="b" onclick="add('${id}',[${fs.map(x=>`'${x[0]}'`)}])">إضافة</button></div>`}
function add(id,ks){const o={};ks.forEach(k=>o[k]=$(id+'_'+k).value);if(!o[ks[0]]&&id!='dl'){alert('أكمل الحقل الأول');return}
 if(id=='dl'){const it=S.items.find(i=>i.name==o.item),c=+o.cartons||0;o.date=o.date||T;o.dept=it?it.dept:'';o.value=it?c*it.price:0;o.ton=it?c*(+it.weight||0)/1000:0;o.cartons=c;o.visits=+o.visits||0;o.coll=+o.coll||0;o.ret=+o.ret||0;if(!o.rep){alert('اختر المندوب');return}}
 ({it:S.items,rp:S.reps,sp:S.sups,ar:S.areas,tg:S.targets,dl:S.daily})[id].push(o);save();go(tab)}
function mv(n,k,v){rep(n)[k]=v;save()}
function ach(rn,p){const d=S.daily.filter(x=>x.rep==rn&&inP(x.date,p));return{v:sum(d,'value'),c:sum(d,'cartons'),t:sum(d,'ton'),vis:sum(d,'visits'),col:sum(d,'coll'),ret:sum(d,'ret')}}
function tgt(rn){const t=S.targets.filter(x=>x.rep==rn);return{s:sum(t,'sales'),cov:sum(t,'cov'),debt:sum(t,'debt')}}
function colT(rn){return tgt(rn).debt+ach(rn,'m').v}
const views={
d(){const D=S.daily.filter(x=>vis(x)&&(!dflt||x.dept==dflt)),all=p=>D.filter(x=>inP(x.date,p)),y=all('y'),m=all('m'),d=all('d');
 const by=(a,fn)=>{const o={};a.forEach(x=>{const k=fn(x);if(k)o[k]=(o[k]||0)+(+x.value||0)});return Object.entries(o).sort((a,b)=>b[1]-a[1])[0]};
 const sec=x=>rep(x.rep).role=='مندوب سوبرات',best=by(m,x=>x.rep),bs=by(m,x=>rep(x.rep).sup),ba=by(m,x=>rep(x.rep).area);

function join(){const c=$('cd').value.trim().toUpperCase(),v=S.invites.find(i=>i.code==c),p=$('lp2').value;if(!v){alert('رمز غير صحيح — اضغط مزامنة أولاً');return}if(p.length<4){alert('كلمة السر 4 أحرف على الأقل');return}if(S.users.some(u=>u.name==v.name&&u.role==v.role)){alert('الحساب موجود، سجّل الدخول');return}S.users.push({name:v.name,role:v.role,pw:H(p)});S.me={role:v.role,name:v.name};save();go('d')}
let busy=0;
async function getLoc(){try{const G=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Geolocation;let p;if(G)p=await G.getCurrentPosition({enableHighAccuracy:true,timeout:6000});else p=await new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:6000}):no());const c=p.coords;return{lat:+c.latitude.toFixed(6),lng:+c.longitude.toFixed(6),acc:Math.round(c.accuracy||0),locAt:new Date().toISOString()}}catch(e){return{}}}
function badge(){const r=$('rb');if(!r)return;let n=$('nb');if(!n){n=document.createElement('span');n.id='nb';n.className='ch';r.appendChild(n)}const p=S.daily.filter(x=>!x.sent).length+S.stock.filter(x=>!x.sent).length,on=navigator.onLine;n.style.background=on?'#15803d':'#b45309';n.textContent=(on?'● متصل':'○ غير متصل')+(p?' · معلّق '+p:'')}
async function autoSync(){if(!navigator.onLine||busy||!S.me||!(S.cfg.url||API_URL))return;if(!S.daily.some(x=>!x.sent)&&!S.stock.some(x=>!x.sent))return;busy=1;const oa=window.alert;window.alert=()=>{};try{await send('daily',1)}finally{window.alert=oa;busy=0;badge()}}
addEventListener('online',()=>{badge();autoSync()});addEventListener('offline',badge);setInterval(()=>{badge();autoSync()},60000);setTimeout(autoSync,3000);

function tabsFor(){const r=(S.me||{}).role,T_={d:'المؤشرات',dl:'يومي',it:'الأصناف',tm:'الفريق',sk:'المخزون',rp:'التقارير',iv:'الدعوات',st:'الإعداد'},o=r=='rep'?['d','dl','st']:r=='sup'?['d','dl','sk','rp','iv','st']:['d','dl','it','tm','sk','rp','iv','st'];return o.map(k=>[k,T_[k]])}

function cfg(){S.cfg={url:$('url').value,key:$('key').value};save();alert('تم الحفظ')}
async function post(path,data){if(!S.cfg.url){alert('أدخل رابط API');return false}try{const r=await fetch(S.cfg.url+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.cfg.key},body:JSON.stringify(data)});alert(r.ok?'تم بنجاح':'فشل: '+r.status)}catch(e){alert('تعذر الاتصال (يعمل داخل تطبيق الأندرويد)')}}
const push=()=>post('/daily',S.daily),pub=()=>post('/publish',{items:S.items,targets:S.targets,reps:S.reps,sups:S.sups});
async function pull(){if(!S.cfg.url){alert('أدخل رابط API');return}try{const r=await fetch(S.cfg.url+'/daily',{headers:{Authorization:'Bearer '+S.cfg.key}});const d=await r.json();if(Array.isArray(d)){S.daily=S.daily.concat(d);save();alert('تم سحب '+d.length+' سجل')}}catch(e){alert('تعذر الاتصال (يعمل داخل تطبيق الأندرويد)')}}
function xl(file){if(!file||!window.XLSX){alert('مكتبة Excel غير متاحة');return}const r=new FileReader();r.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array'}),mp={'أصناف':'items','مناديب':'reps','مشرفين':'sups','أهداف':'targets'};let n=0;wb.SheetNames.forEach(s=>{const k=mp[s.trim()];if(k){const rows=XLSX.utils.sheet_to_json(wb.Sheets[s]);S[k]=S[k].concat(rows);n+=rows.length}});save();alert('تم استيراد '+n+' سجل');go('st')};r.readAsArrayBuffer(file)}

function go(t){if(!S.me)return login();if(!tabsFor().some(x=>x[0]==t))t='d';$('lo').style.display='block';const RL={admin:['الإدارة','#f58220'],sup:['مشرف','#38bdf8'],rep:['مندوب','#4ade80']}[S.me.role];document.querySelector('header').style.borderBottomColor=RL[1];$('rb').innerHTML=`<span class="ch" style="border-inline-start:4px solid ${RL[1]}">${RL[0]}${S.me.role=='admin'?'':' · '+S.me.name}</span>`+VB;tab=t;$('m').innerHTML=views[t]();$('n').innerHTML=NB+'<div class="tb">'+tabsFor().map(([k,l])=>`<button class="${k==t?'on':''}" onclick="go('${k}')"><i>${NI[k]}</i>${l}</button>`).join('')+'</div>'+NP;if(S.me.role=='rep'&&$('dl_rep'))$('dl_rep').value=S.me.name;badge();scrollTo(0,0)}
